<ion-content>
  <img src="assets/logo.png" alt="De Corazón" class="page-logo">
  <h1 class="page-title">Preguntas frecuentes</h1>

  <section class="faq-section" *ngFor="let section of faqSections; let i = index">
    <button type="button"
            class="section-header"
            [attr.aria-expanded]="section.isOpen"
            [attr.aria-controls]="'faq-seccion-' + i"
            (click)="toggleSection(section)">
      <span>{{ section.title }}</span>
      <ion-icon [name]="section.isOpen ? 'chevron-up' : 'chevron-down'" aria-hidden="true"></ion-icon>
    </button>

    <div class="section-content" [id]="'faq-seccion-' + i" *ngIf="section.isOpen">
      <ion-accordion-group>
        <ion-accordion *ngFor="let item of section.items">
          <ion-item slot="header">
            <ion-label>{{ item.question }}</ion-label>
          </ion-item>

          <div slot="content" class="accordion-content">
            <p>{{ item.answer }}</p>

            <video *ngIf="item.videoUrl" controls preload="metadata">
              <source [src]="item.videoUrl" type="video/mp4">
              Tu navegador no puede reproducir este vídeo.
            </video>
          </div>
        </ion-accordion>
      </ion-accordion-group>
    </div>
  </section>

  <ion-button expand="block" fill="outline" routerLink="/perfil" class="acciones">
    <ion-icon slot="start" name="arrow-back" aria-hidden="true"></ion-icon>
    Volver a mi perfil
  </ion-button>
</ion-content>
