<ion-content class="ion-padding">
  <div class="image-container">
    <img src="assets/logo.png" alt="Imagen pequeña" class="small-image">
  </div>
  <div class="faq-container">
    <h2 class="task-title">Preguntas frecuentes</h2>
    
    <div class="faq-sections">
      <div class="faq-section" *ngFor="let section of faqSections">
        <div class="section-header" (click)="toggleSection(section)">
          <p>{{ section.title }}</p>
          <ion-icon [name]="section.isOpen ? 'chevron-up' : 'chevron-down'"></ion-icon>
        </div>
        
        <div class="section-content" [class.open]="section.isOpen">
          <ion-list>
            <ion-accordion-group>
              <ion-accordion *ngFor="let item of section.items">
                <ion-item slot="header">
                  <ion-label>{{ item.question }}</ion-label>
                </ion-item>
                
                <div slot="content" class="accordion-content">
                  <p>{{ item.answer }}</p>
                  
                  <div *ngIf="item.videoUrl" class="video-container">
                    <video controls>
                      <source [src]="item.videoUrl" type="video/mp4">
                      Tu navegador no soporta la reproducción de videos.
                    </video>
                  </div>
                </div>
              </ion-accordion>
            </ion-accordion-group>
          </ion-list>
        </div>
      </div>
    </div>
    <ion-button expand="block" routerLink="/perfil">Volver</ion-button>
  </div>
</ion-content>
