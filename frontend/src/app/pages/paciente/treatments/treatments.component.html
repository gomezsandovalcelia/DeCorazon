<ion-content class="ion-padding">
  <!-- Imagen pequeña en la parte superior -->
  <div class="image-container">
    <img src="assets/logo.png" alt="Imagen pequeña" class="small-image">
  </div>

  <h2 class="task-title">Tus tratamientos</h2>
  
  <ion-list>
    <ion-item *ngFor="let treatment of treatments">
      <ion-label>
        <p>{{ treatment.date }}</p>
        <h2>{{ treatment.description }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
  <ion-item *ngIf="treatments.length === 0">
    <ion-label>
      <p>No hay tratamientos disponibles.</p>
    </ion-label>
  </ion-item>
  <!--<ion-button expand="block" type="submit" routerLink="/home1">
    Volver
  </ion-button>-->
</ion-content>
