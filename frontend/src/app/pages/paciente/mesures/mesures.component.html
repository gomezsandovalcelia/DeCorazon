<ion-content>
  <img src="assets/logo.png" alt="De Corazón" class="page-logo">
  <h1 class="page-title">Mis medidas de hoy</h1>

  <ion-card>
    <ion-card-content>
      <form (ngSubmit)="registrarMedidas()" [formGroup]="measureForm">
        <ion-input formControlName="weight" type="number" inputmode="decimal"
                   label="Peso (kg)" labelPlacement="stacked" fill="outline"
                   [helperText]="'Entre ' + rangos.weight.min + ' y ' + rangos.weight.max + ' kg'"
                   errorText="Escribe un peso válido"></ion-input>

        <ion-input formControlName="heart_rate" type="number" inputmode="numeric"
                   label="Pulso (pulsaciones por minuto)" labelPlacement="stacked" fill="outline"
                   [helperText]="'Entre ' + rangos.heart_rate.min + ' y ' + rangos.heart_rate.max"
                   errorText="Escribe un pulso válido"></ion-input>

        <ion-input formControlName="blood_pressure" type="text"
                   label="Tensión (mmHg)" labelPlacement="stacked" fill="outline"
                   helperText="Escríbela así: 120/80"
                   errorText="Usa el formato 120/80"></ion-input>

        <ion-button expand="block" type="submit" [disabled]="measureForm.invalid">
          Guardar medidas
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
