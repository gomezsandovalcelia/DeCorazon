<ion-content class="ion-padding">
  <!-- Imagen pequeña en la parte superior -->
  <div class="image-container">
    <img src="assets/logo.png" alt="Imagen pequeña" class="small-image">
  </div>

  <h2 class="task-title">Tus ejercicios de la semana</h2>
  
  <ion-list>
    <ion-item *ngFor="let ex of exercise">
      <ion-label>
        <p>{{ ex.date }}</p>
        <h2>{{ ex.description }}</h2>
      </ion-label>
      <ion-checkbox slot="end" [(ngModel)]="ex.checkpoint" (ionChange)="updateCheckpoint(ex)"></ion-checkbox>
      
    </ion-item>
  </ion-list>
  <ion-item *ngIf="exercise.length === 0">
    <ion-label>
      <p>No hay ejercicios disponibles.</p>
    </ion-label>
  </ion-item>
  <!--<ion-button expand="block" type="submit" routerLink="/home1">
    Volver
  </ion-button>-->
</ion-content>
