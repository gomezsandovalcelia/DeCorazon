<ion-content class="ion-padding">
  <!-- Imagen pequeña en la parte superior -->
  <div class="image-container">
    <img src="assets/logo.png" alt="Imagen pequeña" class="small-image">
  </div>

  <h2 class="task-title">Tus ejercicios de la semana</h2>
  
  <ion-list>
    <ion-item *ngFor="let item of items; let i = index">
      <ion-label>{{ item.name }}</ion-label>
      <ion-checkbox slot="start" [(ngModel)]="item.checked"></ion-checkbox>
    </ion-item>
  </ion-list>
  <ion-button expand="block" type="submit" routerLink="/home1">
    Volver
  </ion-button>
</ion-content>
