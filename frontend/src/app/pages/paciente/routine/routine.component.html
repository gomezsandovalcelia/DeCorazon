<ion-content>
  <img src="assets/logo.png" alt="De Corazón" class="page-logo">
  <h1 class="page-title">Mis ejercicios</h1>

  <ion-card *ngFor="let ex of exercise" class="ejercicio" [class.hecho]="ex.checkpoint">
    <ion-item lines="none">
      <ion-checkbox [(ngModel)]="ex.checkpoint" (ionChange)="updateCheckpoint(ex)" justify="space-between">
        <span class="ejercicio-fecha">{{ ex.date | date:"EEEE d 'de' MMMM" }}</span>
        <span class="ejercicio-texto">{{ ex.description }}</span>
        <span class="ejercicio-estado">{{ ex.checkpoint ? '✓ Hecho' : 'Marcar como hecho' }}</span>
      </ion-checkbox>
    </ion-item>
  </ion-card>

  <p *ngIf="exercise.length === 0" class="empty-state">No tienes ejercicios esta semana.</p>
</ion-content>
