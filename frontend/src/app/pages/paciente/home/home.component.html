<ion-content class="ion-padding">
    <!-- Imagen pequeña en la parte superior -->
    <div class="image-container">
      <img src="assets/logo.png" alt="Imagen pequeña" class="small-image">
    </div>
  
    <!-- Botón negro debajo de la imagen -->
    <ion-button expand="block" class="register-button"  routerLink="/medidas">
      Registra tus datos
    </ion-button>

    <h2 class="task-title" routerLink="/ejercicios">Tareas Pendientes</h2>
    <ion-list>
      <ion-item *ngFor="let ex of exercise">
        <ion-label>
          <p>{{ ex.date }}</p>
          <h2>{{ ex.description }}</h2>
        </ion-label>
        <ion-checkbox slot="end" [(ngModel)]="ex.checkpoint" (ionChange)="updateCheckpoint(ex)"></ion-checkbox>
        
      </ion-item>
    </ion-list>
    <ion-item *ngIf="exercise.length === 0">
      <ion-label>
        <p>No hay ejercicios disponibles.</p>
      </ion-label>
    </ion-item>
    <h2 class="task-title" routerLink="/tratamiento">Tratamiento de hoy</h2>
    <ion-list>
      <ion-item *ngFor="let treatment of treatments">
        <ion-label>
          <p>{{ treatment.date }}</p>
          <h2>{{ treatment.description }}</h2>
        </ion-label>
      </ion-item>
    </ion-list>
    <ion-item *ngIf="treatments.length === 0">
      <ion-label>
        <p>No hay tratamientos disponibles.</p>
      </ion-label>
    </ion-item>
</ion-content>
