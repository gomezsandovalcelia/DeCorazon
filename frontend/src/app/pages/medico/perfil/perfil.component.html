<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<ion-content class="ion-padding">
  <div class="header-container">
    <img src="assets/logo.png" alt="Imagen pequeña" class="small-image">

    <!-- Botón de perfil en la esquina superior derecha -->
    <ion-button routerLink="/medico/dashboard" class="profile-icon" fill="clear">
      <span style="color: #6b1a0b;" class="material-symbols-outlined">
        home
        </span>
    </ion-button>
  </div>

  <h2 class="task-title">Tu información</h2>
  <ion-item *ngIf="medico">
    <ion-label>
      <p><strong>Nombre:</strong> {{ medico.nombre }} {{ medico.apellidos }}</p>
      <p><strong>Correo:</strong> {{ medico.email }}</p>
    </ion-label>
  </ion-item>
  <ion-button expand="block" (click)="logout()" style="--background: #6b1a0b; margin-top: 20px;" type="submit" routerLink="/home1">
    Cerrar Sesión
  </ion-button>
</ion-content>
