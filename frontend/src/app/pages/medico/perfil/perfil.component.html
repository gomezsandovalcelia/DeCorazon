<ion-content class="ion-padding">
  <div class="image-container">
    <img src="assets/logo.png" alt="Imagen pequeña" class="small-image">
  </div>

  <h2 class="task-title">Tu información</h2>
  <ion-item *ngIf="medico">
    <ion-label>
      <p><strong>Nombre:</strong> {{ medico.nombre }} {{ medico.apellidos }}</p>
      <p><strong>Correo:</strong> {{ medico.email }}</p>
    </ion-label>
  </ion-item>
  <ion-button expand="block" (click)="logout()" style="--background: #6b1a0b; margin-top: 20px;" type="submit" routerLink="/home1">
    Cerrar Sesión
  </ion-button>
</ion-content>
