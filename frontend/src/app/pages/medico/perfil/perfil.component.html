<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/medico/dashboard" aria-label="Volver a mis pacientes">
        <ion-icon slot="icon-only" name="arrow-back" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Mi perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngIf="medico">
    <ion-card-content>
      <div class="dato">
        <span class="dato-label">Nombre</span>
        <span class="dato-valor">{{ medico.nombre }} {{ medico.apellidos }}</span>
      </div>
      <div class="dato">
        <span class="dato-label">Correo</span>
        <span class="dato-valor">{{ medico.email }}</span>
      </div>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" fill="outline" (click)="logout()" class="acciones">
    <ion-icon slot="start" name="log-out-outline" aria-hidden="true"></ion-icon>
    Cerrar sesión
  </ion-button>
</ion-content>
