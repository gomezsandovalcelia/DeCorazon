<ion-content>
  <div class="auth-container">
    <img src="assets/logo.png" alt="De Corazón" class="auth-logo auth-logo-pequeno">
    <h1>Registrarme</h1>

    <ion-input label="Nombre" labelPlacement="stacked" fill="outline" type="text"
               autocomplete="given-name" maxlength="20"></ion-input>
    <ion-input label="Apellidos" labelPlacement="stacked" fill="outline" type="text"
               autocomplete="family-name" maxlength="40"></ion-input>
    <ion-input label="Correo electrónico" labelPlacement="stacked" fill="outline" type="email"
               inputmode="email" autocomplete="email"
               errorText="Escribe un correo válido" ngModel email></ion-input>
    <ion-input label="Contraseña" labelPlacement="stacked" fill="outline" type="password"
               autocomplete="new-password" maxlength="20">
      <ion-input-password-toggle slot="end" showLabel="Mostrar contraseña" hideLabel="Ocultar contraseña"></ion-input-password-toggle>
    </ion-input>
    <ion-input label="Repetir contraseña" labelPlacement="stacked" fill="outline" type="password"
               autocomplete="new-password" maxlength="20">
      <ion-input-password-toggle slot="end" showLabel="Mostrar contraseña" hideLabel="Ocultar contraseña"></ion-input-password-toggle>
    </ion-input>

    <ion-button expand="block">Crear cuenta</ion-button>

    <p class="auth-alternativa">¿Ya tienes cuenta?</p>
    <ion-button expand="block" fill="outline" routerLink="/login">Iniciar sesión</ion-button>
    <ion-button expand="block" fill="clear" color="medium" routerLink="/landing">
      <ion-icon slot="start" name="arrow-back" aria-hidden="true"></ion-icon>
      Volver
    </ion-button>
  </div>
</ion-content>
