<ion-content>
  <div class="auth-container">
    <img src="assets/logo.png" alt="De Corazón" class="auth-logo auth-logo-pequeno">
    <h1>Iniciar sesión</h1>

    <form (ngSubmit)="login()" [formGroup]="loginForm">
      <ion-input type="email" formControlName="email" inputmode="email" autocomplete="email"
                 label="Correo electrónico" labelPlacement="stacked" fill="outline"
                 errorText="Escribe un correo válido"></ion-input>

      <ion-input type="password" formControlName="password" autocomplete="current-password"
                 label="Contraseña" labelPlacement="stacked" fill="outline"
                 errorText="Escribe tu contraseña">
        <ion-input-password-toggle slot="end" showLabel="Mostrar contraseña" hideLabel="Ocultar contraseña"></ion-input-password-toggle>
      </ion-input>

      <ion-button expand="block" type="submit">Entrar</ion-button>
    </form>

    <p class="auth-alternativa">¿No tienes cuenta?</p>
    <ion-button expand="block" fill="outline" routerLink="/registro">Registrarme</ion-button>
    <ion-button expand="block" fill="clear" color="medium" routerLink="/landing">
      <ion-icon slot="start" name="arrow-back" aria-hidden="true"></ion-icon>
      Volver
    </ion-button>
  </div>
</ion-content>
