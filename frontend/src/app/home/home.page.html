<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <!--<ion-title size="large">Bienvenido</ion-title> -->
    </ion-toolbar>
  </ion-header>

  <!-- Contenedor principal -->
  <div id="container" style="text-align: center; padding: 20px;">
    <!-- Espacio para la imagen -->
    <div>
      <img src="assets/logo.png" alt="Logo de la aplicación" style="width: 200px; height: auto; ">
    </div>

    <!-- Texto de bienvenida -->
    <strong style="font-size: 1.2em;">¡Bienvenido!</strong>
    <p style="color: gray; margin-bottom: 40px;">Selecciona una opción para continuar</p>

    <!-- Botón de Iniciar Sesión -->
    <ion-button expand="block" style=" margin-bottom: 20px;" routerLink="/home/login">
      Inicia Sesión
    </ion-button>

    <!-- Botón de Registro -->
    <ion-button expand="block" routerLink="/home/registro">
      Regístrate
    </ion-button>

  </div>
</ion-content>
